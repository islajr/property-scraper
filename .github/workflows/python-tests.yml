name: Property Scraper CI

# Trigger the workflow on push or pull requests to 'master'
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: property_scraper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/property_scraper_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/property_scraper_test
      TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
      TELEGRAM_CHAT_ID:   ${{secrets.TELEGRAM_CHAT_ID}}
      NOMINATIM_CONTACT_EMAIL:  ${{secrets.NOMINATIM_CONTACT_EMAIL}}
      DEBUG: "False"
      API_ENV: "testing"

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: set up python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: install dependencies
      run:  |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: run tests
      run:  |
        pytest tests -v